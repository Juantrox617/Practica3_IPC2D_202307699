{% extends 'inventario/base.html' %}

{% block title %}Editar Producto - Sistema de Inventario{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="color: #667eea;">✏️ Editar Producto</h2>
    <a href="{% url 'listar_productos' %}" class="btn btn-primary">⬅️ Volver</a>
</div>

<div class="card">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="nombre">Nombre del Producto *</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
        </div>
        
        <div class="form-group">
            <label for="categoria">Categoría *</label>
            <input type="text" id="categoria" name="categoria" value="{{ producto.categoria }}" required>
        </div>
        
        <div class="form-group">
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" name="descripcion" required>{{ producto.descripcion }}</textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label for="precio">Precio (Q) *</label>
                <input type="number" id="precio" name="precio" step="0.01" value="{{ producto.precio }}" required min="0">
            </div>
            
            <div class="form-group">
                <label for="stock">Stock (unidades) *</label>
                <input type="number" id="stock" name="stock" value="{{ producto.stock }}" required min="0">
            </div>
        </div>
        
        <div class="form-group">
            <label for="fecha_vencimiento">Fecha de Vencimiento (opcional)</label>
            <input type="date" id="fecha_vencimiento" name="fecha_vencimiento" value="{{ producto.fecha_vencimiento }}">
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button type="submit" class="btn btn-success">💾 Actualizar Producto</button>
            <a href="{% url 'listar_productos' %}" class="btn btn-danger">❌ Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
